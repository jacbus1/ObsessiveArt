name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm test && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Start local server
        run: |
          node server.mjs > /tmp/obsessiveart.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/healthz && break || sleep 1; done
      - name: Existing application regression tests
        run: python tests/browser_test.py
      - name: English-first and language preservation tests
        run: python tests/english_browser_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: obsessiveart-static-site
          path: dist/
