name: Publish README screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/capture_readme.py
      - .github/workflows/screenshots.yml
permissions:
  contents: read
concurrency:
  group: readme-screenshots
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm run check && npm test && npm run build
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Start application
        run: |
          node server.mjs > /tmp/obsessiveart-screenshots.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/healthz; then exit 0; fi
            sleep 1
          done
          cat /tmp/obsessiveart-screenshots.log
          exit 1
      - name: Run real browser regression tests
        run: python tests/browser_test.py
      - name: Capture English and Traditional Chinese interfaces
        run: python tools/capture_readme.py
      - name: Publish only generated screenshot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: publish real English and Traditional Chinese UI screenshots'
          git push origin HEAD:main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: readme-screenshot-evidence
          path: |
            docs/screenshots/
            test-results/browser-results.json
          if-no-files-found: ignore
