<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light"><meta name="description" content="ObsessArt — a personal space for connected thinking.">
  <title>ObsessArt — Room to think</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to workspace</a>
  <div id="app" class="app" aria-busy="true"><div class="loading">ObsessArt · Opening your workspace…</div></div>
  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="dialog"><form method="dialog"><header><h2 id="dialog-title"></h2><button value="cancel" aria-label="Close dialog" class="icon-button">×</button></header><div id="dialog-body"></div><footer id="dialog-footer"></footer></form></dialog>
  <input id="import-file" type="file" accept="application/json,.json,.md,text/markdown" hidden>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
